<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Osaka 2026</title>
    <meta name="theme-color" content="#FAF9F6">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🇯🇵</text></svg>">

    <!-- 1. 引入 React 核心 -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- 2. 引入 Babel (讓瀏覽器看懂 JSX) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- 3. 引入 Tailwind CSS (樣式庫) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 4. 引入 Lucide Icons (圖標資料) -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- 5. 引入 Google Fonts (Noto Serif TC) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: "Noto Serif TC", serif;
            background-color: #FAF9F6;
            color: #000000;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none; 
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        html {
            scroll-behavior: smooth;
        }
        /* 自定義選取顏色 */
        ::selection {
            background-color: #6386BB;
            color: white;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 1. 圖標轉換工具 ---
        const IconWrapper = ({ name, size = 24, color = "currentColor", className, ...props }) => {
            if (typeof lucide === 'undefined' || !lucide.icons) return null;
            const iconData = lucide.icons[name];
            if (!iconData) return null;
            if (Array.isArray(iconData)) {
                 return (
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width={size}
                        height={size}
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke={color}
                        strokeWidth="2"
                        strokeLinecap="round"
                        strokeLinejoin="round"
                        className={`lucide lucide-${name} ${className || ''}`}
                        {...props}
                    >
                        {iconData.map(([tag, attrs], index) => (
                            React.createElement(tag, { ...attrs, key: index })
                        ))}
                    </svg>
                );
            }
            return null;
        };

        const Plane = (props) => <IconWrapper name="Plane" {...props} />;
        const MapIcon = (props) => <IconWrapper name="Map" {...props} />;
        const TrainFront = (props) => <IconWrapper name="TrainFront" {...props} />;
        const Hotel = (props) => <IconWrapper name="Hotel" {...props} />;
        const CheckSquare = (props) => <IconWrapper name="CheckSquare" {...props} />;
        const Wallet = (props) => <IconWrapper name="Wallet" {...props} />;
        const ChevronRight = (props) => <IconWrapper name="ChevronRight" {...props} />;
        const Calendar = (props) => <IconWrapper name="Calendar" {...props} />;
        const CreditCard = (props) => <IconWrapper name="CreditCard" {...props} />;
        const MapPin = (props) => <IconWrapper name="MapPin" {...props} />;
        const PlusCircle = (props) => <IconWrapper name="PlusCircle" {...props} />;
        const Clock = (props) => <IconWrapper name="Clock" {...props} />;
        const User = (props) => <IconWrapper name="User" {...props} />;
        const Hash = (props) => <IconWrapper name="Hash" {...props} />;
        const Info = (props) => <IconWrapper name="Info" {...props} />;
        const Bus = (props) => <IconWrapper name="Bus" {...props} />;
        const Key = (props) => <IconWrapper name="Key" {...props} />;
        const ExternalLink = (props) => <IconWrapper name="ExternalLink" {...props} />;
        const Ticket = (props) => <IconWrapper name="Ticket" {...props} />;
        const ArrowRight = (props) => <IconWrapper name="ArrowRight" {...props} />;
        const CloudSun = (props) => <IconWrapper name="CloudSun" {...props} />;
        const X = (props) => <IconWrapper name="X" {...props} />;
        const Droplets = (props) => <IconWrapper name="Droplets" {...props} />;
        const Thermometer = (props) => <IconWrapper name="Thermometer" {...props} />;
        const Wind = (props) => <IconWrapper name="Wind" {...props} />;
        const Shield = (props) => <IconWrapper name="Shield" {...props} />;
        const Link = (props) => <IconWrapper name="Link" {...props} />;
        const AlertCircle = (props) => <IconWrapper name="AlertCircle" {...props} />;
        const ChevronDown = (props) => <IconWrapper name="ChevronDown" {...props} />;
        const Car = (props) => <IconWrapper name="Car" {...props} />;
        const Utensils = (props) => <IconWrapper name="Utensils" {...props} />;
        const Table = (props) => <IconWrapper name="Table" {...props} />;
        const PenLine = (props) => <IconWrapper name="PenLine" {...props} />;
        const RefreshCw = (props) => <IconWrapper name="RefreshCw" {...props} />;
        const DollarSign = (props) => <IconWrapper name="DollarSign" {...props} />;
        const List = (props) => <IconWrapper name="List" {...props} />;
        const Pencil = (props) => <IconWrapper name="Pencil" {...props} />;
        const Trash2 = (props) => <IconWrapper name="Trash2" {...props} />;
        const Check = (props) => <IconWrapper name="Check" {...props} />;
        const ExternalLinkIcon = (props) => <IconWrapper name="ExternalLink" {...props} />;

        const ShoppingBagIcon = ({size, className}) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        );

        const FishIcon = ({size, className}) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M6.5 12c.94-3.46 4.94-6 8.5-6 3.56 0 6.06 2.54 7 6-.94 3.47-3.44 6-7 6s-7.56-2.53-8.5-6Z"/><path d="M18 12v.5"/><path d="M16 17.93a9.77 9.77 0 0 1 0-11.86"/><path d="M7 10.67C7 8 5.58 5.97 2.73 5.5c-1 1.5-1 5 .23 6.5-1.24 1.5-1.24 5-.23 6.5C5.58 18.03 7 16 7 13.33"/><path d="M10.42 15.12c-.1-.09-.15-.13-.2-.25-.1-.24-.09-.5.03-.74.13-.26.37-.43.66-.47.29-.04.58.02.82.17.24.15.39.41.42.69.04.29-.02.58-.17.82-.15.24-.41.39-.69.42a.88.88 0 0 1-.87-.64Z"/></svg>
        );

        // --- Helper Functions for Weather ---
        const getWeatherIcon = (code) => {
            if (code === 0) return "☀️";
            if (code === 1) return "🌤️";
            if (code === 2) return "⛅";
            if (code === 3) return "☁️";
            if (code >= 45 && code <= 48) return "🌫️";
            if (code >= 51 && code <= 67) return "🌧️";
            if (code >= 71 && code <= 77) return "🌨️";
            if (code >= 80 && code <= 99) return "⛈️";
            return "❓";
        };

        const getWeatherDescription = (code) => {
            const descriptions = {
                0: "晴天", 1: "大致晴朗", 2: "晴時多雲", 3: "多雲",
                45: "霧", 48: "凍霧",
                51: "毛毛雨", 53: "毛毛雨", 55: "毛毛雨",
                61: "小雨", 63: "中雨", 65: "大雨",
                66: "凍雨", 67: "凍雨",
                71: "小雪", 73: "中雪", 75: "大雪", 77: "米雪",
                80: "陣雨", 81: "陣雨", 82: "強陣雨",
                95: "雷雨", 96: "雷雨伴隨冰雹", 99: "強雷雨伴隨冰雹",
            };
            return descriptions[code] || "未知天氣";
        };

        // --- 可重複使用的收合元件 ---
        const CollapsibleSection = ({ title, subTitle, icon: Icon, children, defaultOpen = false, accentColor = "bg-[#4A70A9]", actionButton = null }) => {
            const [isOpen, setIsOpen] = useState(defaultOpen);
            const contentRef = useRef(null);
            const [height, setHeight] = useState(defaultOpen ? 'auto' : '0px');

            useEffect(() => {
                if (isOpen) {
                    const scrollHeight = contentRef.current ? contentRef.current.scrollHeight : 0;
                    setHeight(`${scrollHeight}px`);
                } else {
                    setHeight('0px');
                }
            }, [isOpen, children]);

            return (
                <div className="bg-white rounded-2xl shadow-sm border border-[#6386BB]/20 overflow-hidden transition-all duration-300 group mb-4">
                    <button 
                        onClick={() => setIsOpen(!isOpen)}
                        className="w-full flex items-center justify-between p-4 bg-white hover:bg-[#FAF9F6] transition-colors text-left relative"
                    >
                        <div className={`absolute left-0 top-0 bottom-0 w-1.5 ${accentColor} opacity-0 group-hover:opacity-100 transition-opacity ${isOpen ? 'opacity-100' : ''}`}></div>

                        <div className="flex items-center gap-3 pl-2">
                            <div className={`w-10 h-10 rounded-full flex items-center justify-center transition-colors ${isOpen ? 'bg-[#4A70A9]/10 text-[#4A70A9]' : 'bg-[#FAF9F6] text-[#6386BB]'}`}>
                                {Icon ? <Icon size={20} /> : <div className="w-2 h-2 bg-current rounded-full" />}
                            </div>
                            <div>
                                <h3 className={`font-bold text-base transition-colors ${isOpen ? 'text-[#4A70A9]' : 'text-black'}`}>{title}</h3>
                                {subTitle && <p className="text-xs text-[#6386BB] mt-0.5 font-medium">{subTitle}</p>}
                            </div>
                        </div>
                        
                        <div className="flex items-center gap-2">
                            {/* 只有展開時，且 actionButton 存在時才顯示 */}
                            {isOpen && actionButton && (
                                <div onClick={(e) => e.stopPropagation()} className="animate-in fade-in zoom-in duration-200">
                                    {actionButton}
                                </div>
                            )}
                            <div className={`p-2 rounded-full transition-all duration-300 ${isOpen ? 'bg-[#4A70A9]/10 text-[#4A70A9] rotate-180' : 'text-[#6386BB]'}`}>
                                <ChevronDown size={20} />
                            </div>
                        </div>
                    </button>
                    
                    <div 
                        ref={contentRef}
                        style={{ maxHeight: height }}
                        className="transition-all duration-500 ease-in-out overflow-hidden"
                    >
                        <div className="p-5 pt-0 border-t border-[#FAF9F6]">
                            <div className="pt-5">
                                {children}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- 新增：交通路線視覺化元件 ---
        const TransportRoute = ({ steps }) => (
            <div className="mt-3 bg-white/50 rounded-xl p-2 border border-[#6386BB]/10">
                {steps.map((step, i) => (
                    <div key={i} className="relative flex items-start gap-3 pb-4 last:pb-0">
                        {/* Vertical Line */}
                        {i !== steps.length - 1 && (
                            <div className="absolute left-[9px] top-3 bottom-0 w-0.5 bg-[#E5E7EB]"></div>
                        )}
                        
                        {/* Dot */}
                        <div className={`mt-1.5 w-5 h-5 rounded-full border-[3px] border-white shadow-sm flex-shrink-0 z-10 ${i === 0 ? 'bg-[#4A70A9]' : (i === steps.length - 1 ? 'bg-[#F26419]' : 'bg-gray-300')}`}></div>
                        
                        <div className="flex-1 pt-1">
                            <div className="flex flex-wrap items-center gap-x-2 gap-y-1">
                                {step.action && <span className="text-xs font-bold text-gray-400">{step.action}</span>}
                                
                                {/* 站名放在前面 */}
                                <span className="font-bold text-gray-800 text-sm md:text-base">{step.station}</span>

                                {step.badge && <ChevronRight size={12} className="text-gray-300" />}

                                {/* 路線標籤放在後面 */}
                                {step.badge && (
                                    <span className={`${step.badgeColor} text-white text-[10px] px-2 py-0.5 rounded font-bold shadow-sm`}>
                                        {step.badge}
                                    </span>
                                )}
                            </div>
                            {step.note && <p className="text-xs text-gray-500 mt-0.5 ml-1">{step.note}</p>}
                        </div>
                    </div>
                ))}
            </div>
        );

        // --- Main Application Component ---
        const OsakaTripApp = () => {
            const [activeTab, setActiveTab] = useState('itinerary'); 
            const [isMobile, setIsMobile] = useState(false);
            const [currentWeather, setCurrentWeather] = useState(null);

            // --- STATE LIFTED UP ---
            const DEFAULT_ITINERARY = {
                1: [
                    { type: 'train', title: '10:12 高鐵 & 機捷前往機場', desc: '🚄 高鐵 0814 車次\n10:12 雲林站 ➜ 11:18 桃園站\n\n🚇 機場捷運\n11:32 高鐵桃園站 ➜ 11:51 第一航廈', linkTab: null },
                    { type: 'plane', title: '14:40 機場吃飯 + 搭飛機', desc: '', linkTab: null },
                    { type: 'map', title: '抵達大阪 & 前往市區', desc: '下飛機後前往大阪市區', linkTab: 'transport' },
                    { type: 'hotel', title: '從市區搭車回飯店入住', desc: '入住 FDS Serene', linkTab: 'accommodation' }
                ],
                2: [
                    { type: 'car', title: '前往環球影城', desc: '飯店 ➜ 環球影城 (搭乘 Uber / DiDi / GO)\n\n📍 上車地：大阪府大阪市港区築港2-4-27\n📍 下車地：USJ ユニバーサル・スタジオ・ジャパン', linkTab: null },
                    { type: 'ticket', title: '環球影城 USJ ꒰✩´˘`✩꒱', desc: '', linkTab: null, externalLink: 'https://q6l3wq.csb.app/', linkText: '遊玩規劃' },
                    { type: 'food', title: '晚餐', desc: '尚待討論！', linkTab: null }
                ],
                3: [
                    { type: 'hotel', title: '09:30 退房 & 前往大阪港站', desc: 'FDS Serene Check-out\n收拾行李，步行前往地鐵大阪港站', linkTab: null },
                    { type: 'map', title: '09:45 寄放行李 (大阪港站)', desc: '📍 地點：大阪港站投幣式置物櫃 (順路)\n💡 備案：若滿了則改至海遊館置物櫃', linkTab: null },
                    { type: 'fish', title: '10:00 大阪海遊館', desc: '🎫 門票入場時間10:15~10:30\n🐟 路線：從 8F 慢慢逛下來 (約 2.5 小時)', linkTab: null },
                    { type: 'food', title: '12:30 午餐：天保山購物中心', desc: '地點：2F 難波美食小巷 (海遊館隔壁)', linkTab: null },
                    { 
                        type: 'train', 
                        title: '14:00 取行李 & 前往市區', 
                        desc: '🔙 回大阪港站取行李', 
                        transport: [
                            { action: '起點', station: '大阪港站', badge: '地鐵 中央線', badgeColor: 'bg-[#10B981]' },
                            { action: '轉乘', station: '弁天町站', badge: 'JR 大阪環狀線', badgeColor: 'bg-[#E11D48]' },
                            { action: '抵達', station: '新今宮站', note: '車程約 25 分鐘' }
                        ],
                        linkTab: 'transport',
                        linkText: '查看交通詳情'
                    },
                    { 
                        type: 'hotel', 
                        title: '14:45 飯店 Check-in', 
                        desc: '🏨 新今宮知鄉標準酒店\n🛏️ 15:00 可入住，或先寄放行李休息', 
                        linkTab: 'accommodation',
                        linkText: '查看飯店詳情'
                    },
                    { 
                        type: 'train', 
                        title: '15:30 前往梅田', 
                        desc: '準備出發去逛街！',
                        transport: [
                            { action: '起點', station: '動物園前站', badge: '地鐵 御堂筋線', badgeColor: 'bg-[#E11D48]' },
                            { action: '抵達', station: '梅田站', note: '車程約 15 分鐘' }
                        ],
                        linkTab: null 
                    },
                    { type: 'shop', title: '16:00 梅田逛街 (茶屋町)', desc: '1. Mizuno Osaka 旗艦店\n2. 球兒先生 (Yodobashi 後方)\n3. Daikoku Drug 梅北店', linkTab: null },
                    { type: 'shop', title: '18:30 LINKS UMEDA', desc: '🎮 電器、相機、扭蛋\n💄 AINZ & TULPE (2F) -- 日系美妝\n👕 UNIQLO (1F)\n💊 B1F 松本清藥妝', linkTab: null },
                    { type: 'food', title: '19:00 晚餐', desc: '🍽️ 但馬屋 LINKS UMEDA店（暫定）｜不能預約', linkTab: null },
                    { 
                        type: 'hotel', 
                        title: '21:00 返回飯店', 
                        desc: '',
                        transport: [
                            { action: '起點', station: '梅田站', badge: '地鐵 御堂筋線', badgeColor: 'bg-[#E11D48]' },
                            { action: '抵達', station: '動物園前站' }
                        ], 
                        linkTab: null 
                    }
                ],
                4: [
                    { type: 'hotel', title: '飯店退房 & 寄放行李', desc: '', linkTab: null },
                    { type: 'map', title: '大阪市區自由行', desc: '在市區逛逛 + 採買', linkTab: null },
                    { type: 'hotel', title: '回飯店拿行李', desc: '傍晚回飯店領取行李', linkTab: null },
                    { 
                        type: 'train', 
                        title: '14:30搭車前往機場飯店', 
                        desc: '南海地鐵詳情：新今宮站→臨空城站（約 30 分鐘）', 
                        linkTab: 'transport', 
                        linkText: '查看交通詳情' 
                    }
                ],
                5: [
                    { type: 'bus', title: '飯店接駁車', desc: '08:55 出發 (10min) ➜ 關西機場 T1', linkTab: 'accommodation' },
                    { type: 'plane', title: '12:00 機場逛街 & 搭機', desc: '機場吃飯、最後採買', linkTab: null }, 
                    { type: 'map', title: '抵達溫暖的家', desc: '桃園一航 (20min) ➜ 桃園高鐵 (1hr) ➜ 雲林高鐵 (30min) ➜ 小家', linkTab: null }
                ]
            };

            const [itineraryData, setItineraryData] = useState(() => {
                const saved = localStorage.getItem('osaka_itinerary_2026_v21'); // Updated to v21
                return saved ? JSON.parse(saved) : DEFAULT_ITINERARY;
            });

            // --- Effects for Auto-Saving ---
            useEffect(() => {
                localStorage.setItem('osaka_itinerary_2026_v21', JSON.stringify(itineraryData));
            }, [itineraryData]);

            useEffect(() => {
                const handleResize = () => {
                    setIsMobile(window.innerWidth < 768);
                };
                handleResize();
                window.addEventListener('resize', handleResize);
                
                const fetchCurrentWeather = async () => {
                    try {
                        const res = await fetch("https://api.open-meteo.com/v1/forecast?latitude=34.69&longitude=135.50&current_weather=true&timezone=Asia/Tokyo");
                        const data = await res.json();
                        setCurrentWeather(data.current_weather);
                    } catch (e) {
                        console.error("Failed to fetch current weather");
                    }
                };
                fetchCurrentWeather();

                return () => window.removeEventListener('resize', handleResize);
            }, []);

            const tripDates = "2026.02.27 - 2026.03.03";
            const daysCount = 5;

            const tabs = [
                { id: 'itinerary', label: '玩', icon: MapIcon },
                { id: 'flights', label: '飛', icon: Plane },
                { id: 'transport', label: '行', icon: TrainFront },
                { id: 'accommodation', label: '宿', icon: Hotel },
                { id: 'weather', label: '晴', icon: CloudSun },
                { id: 'todo', label: '待', icon: CheckSquare },
                { id: 'expenses', label: '帳', icon: Wallet },
            ];

            // --- Views ---
            const ItineraryView = () => {
                const [isEditing, setIsEditing] = useState(false);
                const [newItem, setNewItem] = useState({ day: 1, type: 'map', time: '', title: '', desc: '' });
                const [editingItem, setEditingItem] = useState(null);
                const [editingDayId, setEditingDayId] = useState(null);
                const [editFormData, setEditFormData] = useState({ title: '', desc: '', type: 'map' });

                const handleAddItem = () => {
                    if (!newItem.title) return;
                    const updatedDay = [...(itineraryData[newItem.day] || [])];
                    const newItemObj = { ...newItem };
                    if(newItem.time) newItemObj.title = `${newItem.time} ${newItem.title}`;
                    updatedDay.push(newItemObj);
                    setItineraryData({ ...itineraryData, [newItem.day]: updatedDay });
                    setNewItem({ day: 1, type: 'map', time: '', title: '', desc: '' });
                    setIsEditing(false);
                };

                const startEditing = (day, index, item) => {
                    setEditingItem({ day, index });
                    setEditFormData({ title: item.title, desc: item.desc || '', type: item.type });
                };

                const saveEdit = (day, index) => {
                    const updatedDay = [...itineraryData[day]];
                    updatedDay[index] = { ...updatedDay[index], ...editFormData };
                    setItineraryData({ ...itineraryData, [day]: updatedDay });
                    setEditingItem(null);
                };

                const cancelEdit = () => {
                    setEditingItem(null);
                };

                const deleteItem = (day, index) => {
                    if(confirm('確定要刪除這個行程嗎？')) {
                        const updatedDay = [...itineraryData[day]];
                        updatedDay.splice(index, 1);
                        setItineraryData({ ...itineraryData, [day]: updatedDay });
                        setEditingItem(null);
                    }
                };

                const getIcon = (type) => {
                    switch(type) {
                        case 'plane': return Plane;
                        case 'train': return TrainFront;
                        case 'hotel': return Hotel;
                        case 'food': return Utensils;
                        case 'car': return Car;
                        case 'ticket': return Ticket;
                        case 'clock': return Clock;
                        case 'bus': return Bus;
                        case 'shop': return ShoppingBagIcon;
                        case 'fish': return FishIcon;
                        default: return MapPin;
                    }
                };

                const getColor = (type) => {
                    switch(type) {
                        case 'plane': return 'bg-[#4A70A9]';
                        case 'train': return 'bg-black';
                        case 'hotel': return 'bg-[#4A70A9]';
                        case 'food': return 'bg-[#F26419]'; 
                        case 'car': return 'bg-[#F26419]'; 
                        case 'ticket': return 'bg-[#F26419]';
                        default: return 'bg-[#6386BB]'; 
                    }
                };

                return (
                    <div className="space-y-6 animate-in fade-in duration-500 pb-24 md:pb-0">

                            <div>
                                <h2 className="text-lg font-bold text-black">每日行程</h2>
                                <p className="text-[#4A70A9] text-xs mt-1 font-medium">Exploring Osaka</p>
                            </div>
                            <button onClick={() => setIsEditing(!isEditing)} className="text-xs bg-[#F26419] text-white px-3 py-1.5 rounded-full hover:bg-[#F26419]/80 transition shadow-sm flex items-center gap-2">
                                {isEditing ? <X size={14} /> : <PlusCircle size={14} />}
                                {isEditing ? '取消新增' : '新增行程'}
                            </button>
                        </div>

                        {isEditing && (
                            <div className="bg-white p-5 rounded-2xl border border-[#4A70A9]/30 shadow-lg mb-6 animate-in slide-in-from-top-4">

                                                <option value="food">餐飲 (刀叉)</option>
                                                <option value="shop">購物 (提袋)</option>
                                                <option value="train">交通 (火車)</option>
                                                <option value="bus">交通 (巴士)</option>
                                                <option value="car">交通 (汽車)</option>
                                                <option value="plane">交通 (飛機)</option>
                                                <option value="hotel">住宿 (飯店)</option>
                                                <option value="ticket">票券 (門票)</option>
                                                <option value="clock">時間 (時鐘)</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-3 gap-3">
                                        <div className="col-span-1">
                                            <label className="block text-xs text-gray-500 mb-1 font-bold">時間 (選填)</label>

                                        </div>
                                        <div className="col-span-2">
                                            <label className="block text-xs text-gray-500 mb-1 font-bold">標題</label>

                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-xs text-gray-500 mb-1 font-bold">詳細說明 (選填)</label>
                                        <textarea placeholder="輸入備註、交通方式等..." className="w-full p-2 bg-[#FAF9F6] border border-gray-200 rounded-lg text-sm outline-none focus:border-[#F26419] resize-none h-20" value={newItem.desc} onChange={(e) => setNewItem({...newItem, desc: e.target.value})} />
                                    </div>
                                    <button onClick={handleAddItem} className="w-full py-3 bg-[#F26419] text-white rounded-xl font-bold text-sm shadow-md hover:bg-[#F26419]/80 transition-colors mt-2">確認新增至 Day {newItem.day}</button>

                            </div>

                        {[1, 2, 3, 4, 5].map((day) => {
                            const dayConfig = {

                                2: { title: "Day 2 - 環球影城", subtitle: "02/28 (六) • 瑪利歐跳跳", icon: Ticket, color: "bg-[#E11D48]" },
                                3: { title: "Day 3 - 海遊館 & 市區", subtitle: "03/01 (日) • 魚兒水中游", icon: FishIcon, color: "bg-[#0EA5E9]" },
                                4: { title: "Day 4 - 市區漫遊", subtitle: "03/02 (一) • 掃貨大作戰", icon: ShoppingBagIcon, color: "bg-[#F59E0B]" },
                                5: { title: "Day 5 - 返程", subtitle: "03/03 (二) • 滿載回家去", icon: Plane, color: "bg-[#10B981]" },
                            }[day];
                            const items = itineraryData[day] || [];
                            const isDayEditing = editingDayId === day;

                            return (
                                <CollapsibleSection 
                                    key={day} 
                                    title={dayConfig.title} 
                                    subTitle={dayConfig.subtitle} 
                                    icon={dayConfig.icon} 
                                    defaultOpen={day === 1} 
                                    accentColor={dayConfig.color}
                                    actionButton={
                                        <button
                                            onClick={() => setEditingDayId(isDayEditing ? null : day)}
                                            className={`p-1.5 rounded-full transition-colors ${isDayEditing ? 'bg-[#F26419] text-white' : 'text-[#6386BB] hover:bg-white'}`}

                                            <Pencil size={16} />
                                        </button>
                                    }
                                >
                                    <div className="space-y-6 pl-4 border-l-2 border-[#FAF9F6]">
                                        {items.map((item, idx) => {
                                            const ItemIcon = getIcon(item.type);
                                            const dotColor = getColor(item.type);
                                            const isEditingThis = editingItem?.day === day && editingItem?.index === idx;

                                                    <div key={idx} className="bg-white p-4 rounded-xl border border-[#F26419] shadow-sm relative z-10 animate-in fade-in">

                                                        </div>
                                                    </div>

                                                <div key={idx} className="relative group/item">
                                                    <div className={`absolute -left-[25px] top-0 w-4 h-4 ${dotColor} rounded-full border-4 border-white shadow-sm`}></div>

                                                        <ItemIcon size={14} className="text-[#6386BB]"/> {item.title}
                                                    </h4>
                                                    
                                                    {/* 一般描述 */}
                                                    {item.desc && (
                                                        <div className={`text-sm text-gray-600 leading-relaxed whitespace-pre-line mb-2 ${item.type === 'car' || item.type === 'hotel' || (!item.transport && item.type === 'train') ? 'bg-[#FAF9F6] p-2 rounded-lg inline-block' : ''}`}>{item.desc}</div>
                                                    )}

                                                    {/* 特殊交通路線渲染 */}
                                                    {item.transport && <TransportRoute steps={item.transport} />}

                                                    {/* 連結按鈕 (內部 Tab 連結) */}
                                                    {item.linkTab && (
                                                        <div className="bg-white border border-[#6386BB]/20 p-3 rounded-xl flex justify-between items-center group cursor-pointer hover:border-[#4A70A9] mt-2" onClick={() => setActiveTab(item.linkTab)}>

                                                            <ArrowRight size={14} className="text-[#6386BB] group-hover:translate-x-1 transition-transform flex-shrink-0 ml-2"/>
                                                        </div>
                                                    )}

                                                    {/* 外部連結按鈕 */}
                                                    {item.externalLink && (
                                                        <a href={item.externalLink} target="_blank" rel="noreferrer" className="bg-white border border-[#6386BB]/20 p-3 rounded-xl flex justify-between items-center group cursor-pointer hover:border-[#4A70A9] mt-2 block no-underline">
                                                            <div className="text-sm text-[#4A70A9] font-bold flex items-center gap-2">
                                                                <ExternalLink size={14} className="text-[#4A70A9]"/>
                                                                {item.linkText || '查看詳情'}
                                                            </div>
                                                            <ArrowRight size={14} className="text-[#6386BB] group-hover:translate-x-1 transition-transform flex-shrink-0 ml-2"/>
                                                        </a>
                                                    )}
                                                    
                                                    {/* 航班按鈕 (僅 Day1/5 plane) */}
                                                    {(day === 1 && item.type === 'plane') || (day === 5 && item.type === 'plane') ? (
                                                        <div className={`absolute right-0 top-0 ${isDayEditing ? 'right-16' : 'right-0'}`}>
                                                            <button className="text-sm font-bold bg-[#F26419] text-white px-4 py-2 rounded-lg hover:bg-[#F26419]/80 transition-colors flex items-center gap-1 shadow-md" onClick={() => setActiveTab('flights')}>
                                                                <Plane size={14} /> 航班
                                                            </button>
                                                        </div>
                                                    ) : null}

                                                    {/* 編輯按鈕 (僅在 Day Editing 模式顯示) */}
                                                    {isDayEditing && (
                                                        <div className="absolute right-0 top-0 flex gap-1">
                                                            <button 
                                                                onClick={() => startEditing(day, idx, item)}
                                                                className="text-[#6386BB] p-1.5 hover:bg-gray-100 rounded bg-white shadow-sm border border-[#6386BB]/20"
                                                            >
                                                                <Pencil size={14} />
                                                            </button>
                                                            <button 
                                                                onClick={() => deleteItem(day, idx)}
                                                                className="text-red-500 p-1.5 hover:bg-red-50 rounded bg-white shadow-sm border border-red-200"
                                                            >
                                                                <Trash2 size={14} />
                                                            </button>
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>
                                </CollapsibleSection>
                            );
                        })}
                    </div>
                );
            };

            const FlightsView = () => (
                <div className="space-y-6 animate-in fade-in duration-500">
                    <h2 className="text-lg font-bold text-black mb-4">航班資訊</h2>
                    <div className="bg-white rounded-3xl shadow-lg overflow-hidden border border-[#6386BB]/20 relative group">
                        <div className="absolute top-0 left-0 w-2 h-full bg-[#4A70A9]"></div>
                        <div className="bg-[#4A70A9] text-white p-4 flex justify-between items-center pl-6">
                            <div className="flex items-center gap-2"><Plane size={20} className="text-[#FAF9F6]" /><span className="font-medium tracking-wide">去程 DEPARTURE</span></div>
                            <span className="text-[#FAF9F6] text-sm">2026/02/27 (五)</span>
                        </div>
                        <div className="p-6 relative pl-8">
                            <div className="absolute top-1/2 left-8 right-6 border-t-2 border-dashed border-[#6386BB]/30 -z-10 mt-[-20px]"></div>
                            <div className="flex justify-between items-center text-center relative z-0 mb-6">
                                <div><div className="text-2xl md:text-3xl font-bold text-black">14:40</div><div className="text-lg font-bold text-[#4A70A9] mt-1">TPE</div><div className="text-sm text-black/60 mt-1">桃園機場 T1</div></div>
                                <div className="bg-white px-2 flex flex-col items-center"><div className="text-sm text-[#6386BB] mb-1 font-bold">2h 15m</div><Plane size={24} className="text-[#4A70A9] rotate-90" /><div className="text-sm text-black/60 font-bold mt-1">台灣虎航</div></div>
                                <div><div className="text-2xl md:text-3xl font-bold text-black">17:55</div><div className="text-lg font-bold text-[#4A70A9] mt-1">KIX</div><div className="text-sm text-black/60 mt-1">關西機場 T1</div></div>
                            </div>
                            <div className="grid grid-cols-3 gap-4 pt-4 border-t border-[#FAF9F6]">
                                <div className="text-center"><div className="text-xs text-[#6386BB] uppercase">Flight</div><div className="font-semibold text-black">IT212</div></div>
                                <div className="text-center"><div className="text-xs text-[#6386BB] uppercase">Passenger</div><div className="font-semibold text-black">金</div></div>
                                <div className="text-center"><div className="text-xs text-[#6386BB] uppercase">Ref</div><div className="font-mono font-semibold text-[#4A70A9]">R8W4XJ</div></div>
                            </div>
                        </div>
                    </div>
                    <div className="bg-white rounded-3xl shadow-lg overflow-hidden border border-[#6386BB]/20 relative group">
                        <div className="absolute top-0 left-0 w-2 h-full bg-[#6386BB]"></div>
                        <div className="bg-[#6386BB] text-white p-4 flex justify-between items-center pl-6">
                            <div className="flex items-center gap-2"><Plane size={20} className="text-white transform rotate-180" /><span className="font-medium tracking-wide">回程 RETURN</span></div>
                            <span className="text-white text-sm">2026/03/03 (二)</span>
                        </div>
                        <div className="p-6 relative pl-8">
                            <div className="absolute top-1/2 left-8 right-6 border-t-2 border-dashed border-[#6386BB]/30 -z-10 mt-[-20px]"></div>
                            <div className="flex justify-between items-center text-center relative z-0 mb-6">
                                <div><div className="text-2xl md:text-3xl font-bold text-black">12:00</div><div className="text-lg font-bold text-[#6386BB] mt-1">KIX</div><div className="text-sm text-black/60 mt-1">關西機場 T1</div></div>
                                <div className="bg-white px-2 flex flex-col items-center"><div className="text-sm text-[#6386BB] mb-1 font-bold">3h 15m</div><Plane size={24} className="text-[#6386BB] rotate-90" /><div className="text-sm text-black/60 font-bold mt-1">泰越捷航空</div></div>

                        </div>

                <div className="space-y-6 animate-in fade-in duration-500">

                            <a href="https://www.westjr.co.jp/global/tc/timetable/pdf/ubn_tc.pdf" target="_blank" rel="noreferrer" className="flex items-center gap-1 text-xs bg-[#4A70A9] text-white px-4 py-2 rounded-full hover:bg-[#3b5a8a] transition cursor-pointer shadow-sm hover:shadow-md font-medium"><MapIcon size={14} /> JR路線</a>

                    </div>

                                        <ChevronRight size={12} className="text-[#6386BB]" />
                                        <span className="font-bold">大阪港站</span>

                            <div className="mt-4 pt-3 border-t border-[#4A70A9]/10 flex items-start gap-2 bg-white p-2 rounded-lg"><Info size={16} className="text-[#4A70A9] mt-0.5 flex-shrink-0" /><div className="text-xs"><span className="font-bold text-[#4A70A9] block mb-1">❗WEST QR 註冊方式：</span><a href="https://www.westjr.co.jp/global/tc/ticket/westqr/userguide/" target="_blank" rel="noreferrer" className="text-black underline hover:text-[#4A70A9] transition-colors break-all">https://www.westjr.co.jp/global/tc/ticket/westqr/userguide/</a></div></div>
                        </div>

                    <CollapsibleSection title="海遊館 ➜ 心齋橋/難波" subTitle="市區移動" icon={TrainFront} accentColor="bg-[#8FABD4]">

                                        <div className="bg-[#FAF9F6] p-3 rounded-xl border border-[#6386BB]/10 flex flex-col items-center"><div className="flex items-center gap-1 text-[#6386BB] text-xs font-bold mb-1"><Droplets size={12} /> 降雨機率</div><span className="text-lg font-bold text-[#4A70A9]">{selectedDay.rain}%</span></div>
                                        <div className="bg-[#FAF9F6] p-3 rounded-xl border border-[#6386BB]/10 flex flex-col items-center"><div className="flex items-center gap-1 text-[#6386BB] text-xs font-bold mb-1"><Wind size={12} /> 平均濕度</div><span className="text-lg font-bold text-black">{selectedDay.humidity}%</span></div>
                                        <div className="bg-[#FAF9F6] p-3 rounded-xl border border-[#6386BB]/10 col-span-2 flex flex-col items-center"><div className="flex items-center gap-1 text-[#6386BB] text-xs font-bold mb-1"><Thermometer size={12} /> 體感溫度</div><span className="text-lg font-bold text-black">{selectedDay.feelMin}° ~ {selectedDay.feelMax}°</span></div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            const TodoView = () => {
                const [isAdding, setIsAdding] = useState(false);
                const [newTodoText, setNewTodoText] = useState('');
                const [newTodoNote, setNewTodoNote] = useState(''); 
                const [newTodoDate, setNewTodoDate] = useState(''); 
                const [newTodoLink, setNewTodoLink] = useState(''); 
                const [newCategory, setNewCategory] = useState('其他');

                const toggleTodo = (id) => {
                    setTodos(todos.map(t => {
                        if (t.id !== id) return t;
                        if (t.status === 'todo') return { ...t, status: 'done' };
                        if (t.status === 'done') return { ...t, status: 'waiting' };
                        if (t.status === 'waiting') return { ...t, status: 'todo' };
                        return t;
                    }));
                };

                const handleAddTodo = () => {
                    // 打開 Google 試算表
                    window.open('https://docs.google.com/spreadsheets/d/1vvvNj9oiw53u_OUSwJlhraNFoIsLUHJZLhiNApedPFI/edit?usp=sharing', '_blank');
                };

                // CSV 解析 helper
                const parseCSV = (text) => {
                    const rows = [];
                    let currentRow = [];
                    let currentCell = '';
                    let inQuote = false;
                    
                    for (let i = 0; i < text.length; i++) {
                        const char = text[i];
                        const nextChar = text[i + 1];
                        
                        if (inQuote) {
                            if (char === '"' && nextChar === '"') {
                                currentCell += '"';
                                i++;
                            } else if (char === '"') {
                                inQuote = false;
                            } else {
                                currentCell += char;
                            }
                        } else {
                            if (char === '"') {
                                inQuote = true;
                            } else if (char === ',') {
                                currentRow.push(currentCell.trim());
                                currentCell = '';
                            } else if (char === '\n' || char === '\r') {
                                if (currentCell || currentRow.length > 0) {
                                    currentRow.push(currentCell.trim());
                                    rows.push(currentRow);
                                }
                                currentRow = [];
                                currentCell = '';
                                if (char === '\r' && nextChar === '\n') i++;
                            } else {
                                currentCell += char;
                            }
                        }
                    }
                    if (currentCell || currentRow.length > 0) {
                        currentRow.push(currentCell.trim());
                        rows.push(currentRow);
                    }
                    return rows;
                };

                // Fetch data from Google Sheet
                const [localTodos, setLocalTodos] = useState([]);
                const [loading, setLoading] = useState(true);
                
                useEffect(() => {
                    const fetchTodos = async () => {
                        try {
                            const response = await fetch('https://docs.google.com/spreadsheets/d/1vvvNj9oiw53u_OUSwJlhraNFoIsLUHJZLhiNApedPFI/gviz/tq?tqx=out:csv');
                            const text = await response.text();
                            const rows = parseCSV(text).slice(1); // Skip header
                            
                            const parsedTodos = rows.map((row, index) => ({
                                id: index,
                                text: row[0] || '',
                                status: row[1] || 'todo',
                                date: row[2] || '',
                                category: row[3] || '其他',
                                note: row[4] || '',
                                link: row[5] || ''
                            })).filter(t => t.text); // Filter empty rows

                            setLocalTodos(parsedTodos);
                        } catch (error) {
                            console.error('Error fetching todos:', error);
                        } finally {
                            setLoading(false);
                        }
                    };
                    fetchTodos();
                }, []);

                const categoryConfig = { '住宿': { color: 'bg-indigo-100 text-indigo-700', icon: Hotel }, '機票': { color: 'bg-blue-100 text-blue-700', icon: Plane }, '保險': { color: 'bg-orange-100 text-orange-700', icon: Shield }, '門票': { color: 'bg-pink-100 text-pink-700', icon: Ticket }, '交通': { color: 'bg-green-100 text-green-700', icon: TrainFront }, '其他': { color: 'bg-gray-100 text-gray-600', icon: CheckSquare } };

                return (
                    <div className="space-y-6 animate-in fade-in duration-500">
                        <div className="flex justify-between items-center"><h2 className="text-lg font-bold text-black">行前清單</h2><button onClick={handleAddTodo} className="text-sm text-[#4A70A9] flex items-center gap-1 hover:underline"><PlusCircle size={16} /> 新增</button></div>
                        
                        {loading ? (
                             <div className="text-center py-10 text-[#6386BB] text-sm animate-pulse">載入中...</div>
                        ) : (
                            <div className="space-y-3">
                                {localTodos.map((todo) => {
                                    const CategoryIcon = categoryConfig[todo.category]?.icon || CheckSquare;
                                    const categoryClass = categoryConfig[todo.category]?.color || 'bg-gray-100 text-gray-600';
                                    const isDone = todo.status === '已完成';
                                    const isWaiting = todo.status === '等待中';
                                    
                                    return (
                                        <div key={todo.id} className={`relative bg-white p-4 rounded-2xl border transition-all duration-300 group ${isDone ? 'border-gray-100 bg-gray-50 opacity-60' : isWaiting ? 'border-orange-200 shadow-sm ring-1 ring-orange-100' : 'border-[#6386BB]/20 shadow-sm hover:shadow-md hover:border-[#6386BB]/40'}`}>
                                            <div className="flex justify-between items-start mb-2"><span className={`text-[10px] font-bold px-2 py-1 rounded-md flex items-center gap-1 ${categoryClass}`}><CategoryIcon size={12} />{todo.category}</span>{todo.date && (<span className="text-[10px] font-medium text-[#6386BB] flex items-center gap-1 bg-[#FAF9F6] px-2 py-1 rounded-full"><Calendar size={10} /> {todo.date}</span>)}</div>
                                            <div className="flex items-start gap-3">
                                                <div className={`mt-0.5 w-5 h-5 rounded-full border-2 flex items-center justify-center transition-colors flex-shrink-0 ${isDone ? 'bg-[#4A70A9] border-[#4A70A9]' : isWaiting ? 'border-yellow-400 bg-yellow-50' : 'border-[#6386BB]'}`}>
                                                    {isDone && <Check size={12} className="text-white" />}
                                                    {isWaiting && <AlertCircle size={12} className="text-yellow-500" />}
                                                </div>
                                                <div className="flex-1 min-w-0">
                                                    <div className={`font-medium text-base leading-tight mb-1 ${isDone ? 'line-through text-gray-400' : 'text-black'}`}>{todo.text}</div>
                                                    {todo.note && (<p className="text-sm text-gray-500 whitespace-pre-line leading-relaxed">{todo.note}</p>)}
                                                </div>
                                                {todo.link && (<a href={todo.link} target="_blank" rel="noreferrer" className="p-2 rounded-full bg-[#FAF9F6] text-[#4A70A9] hover:bg-[#4A70A9] hover:text-white transition-colors self-center"><ExternalLinkIcon size={16} /></a>)}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                    </div>
                );
            };

            const ExpensesView = () => {
                const [mode, setMode] = useState('list');
                const [expenses, setExpenses] = useState([]);
                const [loading, setLoading] = useState(true);
                const [error, setError] = useState(null);
                const [totalSpent, setTotalSpent] = useState(0);
                const [categorySummary, setCategorySummary] = useState({});
                const BUDGET_LIMIT = 30000;

                const fetchExpenses = async () => {
                    setLoading(true);
                    setError(null);
                    const sheetId = '1nFTFyx0XU3zs1cqGbx5IAp3c8xYGul82tfJJNvJFeLI';
                    const csvUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv`;
                    try {
                        const response = await fetch(csvUrl);
                        if (!response.ok) throw new Error('無法取得記帳資料');
                        const text = await response.text();
                        const rows = text.split('\n').slice(1);
                        const parsedData = rows.map(row => {
                            const matches = row.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g);
                            const cols = matches ? matches.map(col => col.replace(/^"|"$/g, '').trim()) : row.split(',').map(col => col.trim());
                            if (!cols[1] || !cols[3]) return null;
                            return { timestamp: cols[0] || '', item: cols[1], category: cols[2] || '其他', amount: parseFloat(cols[3].replace(/,/g, '')) || 0, currency: cols[4] || 'TWD', payer: cols[5] || '' };
                        }).filter(item => item !== null);
                        setExpenses(parsedData.reverse());
                        const total = parsedData.reduce((acc, curr) => acc + curr.amount, 0);
                        setTotalSpent(total);
                        const summary = parsedData.reduce((acc, curr) => { acc[curr.category] = (acc[curr.category] || 0) + curr.amount; return acc; }, {});
                        setCategorySummary(summary);
                    } catch (err) { console.error("CSV Fetch Error:", err); setError('無法自動抓取資料。請確認網路連線或是權限設定。'); } finally { setLoading(false); }
                };

                useEffect(() => { if (mode === 'list') fetchExpenses(); }, [mode]);
                const percent = Math.min((totalSpent / BUDGET_LIMIT) * 100, 100);
                const isOverBudget = totalSpent > BUDGET_LIMIT;

                return (
                    <div className="space-y-4 animate-in fade-in duration-500 h-full flex flex-col">
                        <div className="flex justify-between items-center shrink-0"><h2 className="text-lg font-bold text-black">旅費記帳</h2><div className="bg-[#FAF9F6] p-1 rounded-xl flex gap-1 border border-[#6386BB]/10"><button onClick={() => setMode('form')} className={`flex items-center gap-1 px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${mode === 'form' ? 'bg-white text-[#4A70A9] shadow-sm' : 'text-[#6386BB] hover:bg-white/50'}`}><PenLine size={14} /> 新增支出</button><button onClick={() => setMode('list')} className={`flex items-center gap-1 px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${mode === 'list' ? 'bg-white text-[#4A70A9] shadow-sm' : 'text-[#6386BB] hover:bg-white/50'}`}><List size={14} /> 收支明細</button></div></div>
                        {mode === 'form' ? (
                            <div className="flex-1 w-full bg-white rounded-2xl shadow-sm border border-[#6386BB]/20 overflow-hidden relative min-h-[500px]"><iframe src="https://docs.google.com/forms/d/e/1FAIpQLSchAaFlK3XF1TBfppZFdtllJ0bXo2UGbL41RLfMHnbt1jhGOg/viewform?embedded=true" width="100%" height="100%" frameBorder="0" marginHeight="0" marginWidth="0" title="記帳表單" className="absolute inset-0 w-full h-full">載入中…</iframe></div>
                        ) : (
                            <div className="space-y-6 pb-24 md:pb-0">
                                <div className="bg-[#4A70A9] text-white p-5 rounded-2xl shadow-lg relative overflow-hidden"><div className="absolute -right-10 -top-10 w-40 h-40 bg-white/10 rounded-full blur-3xl"></div><div className="flex justify-between items-start mb-2 relative z-10"><p className="text-[#8FABD4] text-xs uppercase tracking-wider text-opacity-80">Total Spent</p><span className={`text-xs font-bold px-2 py-1 rounded-full ${isOverBudget ? 'bg-red-500 text-white' : 'bg-white/20 text-white'}`}>預算 {percent.toFixed(1)}%</span></div><h3 className="text-3xl font-bold font-mono flex items-center gap-1 relative z-10 mb-4"><DollarSign size={20} className="opacity-70" />{totalSpent.toLocaleString()}</h3><div className="w-full h-2 bg-black/20 rounded-full overflow-hidden relative z-10"><div className={`h-full rounded-full transition-all duration-1000 ease-out ${isOverBudget ? 'bg-red-400' : 'bg-white'}`} style={{ width: `${percent}%` }}></div></div><div className="mt-4 flex gap-2 overflow-x-auto pb-1 scrollbar-hide relative z-10">{Object.entries(categorySummary).map(([cat, amount]) => (<span key={cat} className="text-[10px] bg-white/20 px-2 py-1 rounded whitespace-nowrap">{cat}: ${amount.toLocaleString()}</span>))}</div></div>
                                <div><div className="flex justify-between items-center mb-3"><h3 className="text-sm font-bold text-[#6386BB] uppercase tracking-wider">近期支出</h3><button onClick={fetchExpenses} className="text-[#6386BB] hover:text-[#4A70A9] transition-colors p-1" title="重新整理"><RefreshCw size={14} className={`${loading ? 'animate-spin' : ''}`} /></button></div>
                                {loading ? (<div className="text-center py-10 text-[#6386BB] text-sm">載入中...</div>) : error ? (<div className="p-6 bg-red-50 text-red-500 text-xs rounded-xl border border-red-100 text-center"><AlertCircle size={24} className="mx-auto mb-2 text-red-400" /><p className="font-bold mb-1">無法載入資料</p><p className="mb-3 opacity-80">{error}</p><a href="https://docs.google.com/spreadsheets/d/1nFTFyx0XU3zs1cqGbx5IAp3c8xYGul82tfJJNvJFeLI/edit?usp=sharing" target="_blank" rel="noreferrer" className="inline-flex items-center gap-1 text-[#4A70A9] underline hover:text-black transition-colors font-medium"><ExternalLink size={12} /> 直接前往 Google 試算表</a></div>) : expenses.length === 0 ? (<div className="text-center py-10 text-gray-400 text-sm">目前沒有記帳紀錄</div>) : (<div className="space-y-3">{expenses.map((ex, i) => (<div key={i} className="flex items-center justify-between bg-[#EFECE3] p-4 rounded-xl border border-[#FAF9F6] shadow-sm hover:shadow-md transition-shadow"><div className="flex items-center gap-3"><div className="w-10 h-10 rounded-full bg-[#FAF9F6] flex items-center justify-center text-[#4A70A9]"><Wallet size={18} /></div><div><p className="font-medium text-black text-sm">{ex.item}</p><div className="flex items-center gap-2"><span className="text-[10px] text-white bg-[#6386BB] px-1.5 py-0.5 rounded">{ex.category}</span><span className="text-[10px] text-gray-400">{ex.timestamp.split(' ')[0]}</span></div></div></div><div className="text-right"><span className="font-mono font-bold text-black block">- ${ex.amount.toLocaleString()}</span>{ex.payer && <span className="text-[10px] text-gray-400">付: {ex.payer}</span>}</div></div>))}</div>)}</div>
                            </div>
                        )}
                    </div>
                );
            };

            return (
                <div className="flex h-screen bg-[#FAF9F6] text-black selection:bg-[#8FABD4]/30" style={{ fontFamily: '"Noto Serif TC", serif' }}>
                    <style>{`@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;600;700;900&display=swap');`}</style>
                    <nav className={`${isMobile ? 'fixed bottom-0 w-full h-20 rounded-t-3xl z-50 flex justify-around items-center px-2 shadow-[0_-5px_20px_rgba(0,0,0,0.05)]' : 'w-64 flex-col p-6 hidden md:flex border-r border-[#6386BB]/20'} bg-[#FAF9F6]/90 backdrop-blur-md transition-all duration-300`}>
                        {!isMobile && (<div className="mb-10 pl-2"><div className="text-lg md:text-2xl font-bold text-black tracking-tight flex items-center gap-2"><span className="w-2 h-8 bg-[#4A70A9] rounded-full"></span><span>Osaka 2026</span></div></div>)}
                        <div className={`flex ${isMobile ? 'w-full justify-around' : 'flex-col gap-2'}`}>
                            {tabs.map((tab) => {
                                const isActive = activeTab === tab.id;
                                const Icon = tab.icon;
                                return (
                                    <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`relative flex items-center transition-all duration-300 group ${isMobile ? 'flex-col justify-center p-2' : `p-3 rounded-xl w-full ${isActive ? 'bg-[#4A70A9] text-white shadow-lg shadow-[#4A70A9]/30' : 'hover:bg-[#6386BB]/20 text-black/60'}`}`}>
                                        {isMobile && isActive && (<div className="absolute -top-2 left-1/2 -translate-x-1/2 w-1 h-1 bg-[#4A70A9] rounded-full"></div>)}
                                        <Icon size={isMobile ? 24 : 20} className={`${isMobile ? (isActive ? 'text-[#4A70A9] mb-1 transform -translate-y-1' : 'text-[#6386BB]') : 'mr-3'} ${!isMobile && !isActive ? 'text-[#6386BB]' : ''} transition-all duration-300`} strokeWidth={isActive ? 2.5 : 2} />
                                        <span className={`${isMobile ? 'text-[10px] font-medium' : 'text-sm font-medium'} ${isMobile && isActive ? 'text-[#4A70A9]' : ''} ${!isMobile && isActive ? 'text-white' : ''}`}>{tab.label}</span>
                                    </button>
                                );
                            })}
                        </div>
                        {!isMobile && (<div className="mt-auto pt-6 border-t border-[#6386BB]/20"><div className="flex items-center gap-3 bg-[#fff] p-3 rounded-xl border border-[#6386BB]/10"><div className="w-8 h-8 rounded-full bg-[#4A70A9] flex items-center justify-center text-white text-xs font-bold">寶</div><div><p className="text-xs font-bold text-black">小金&小魏</p></div></div></div>)}
                    </nav>
                    <main className="flex-1 overflow-y-auto h-full relative scroll-smooth">
                        <header className="sticky top-0 z-40 bg-[#FAF9F6]/90 backdrop-blur-sm px-6 py-3 md:px-10 md:py-6 flex justify-between items-center border-b border-[#6386BB]/10">
                            <div><h1 className="text-lg md:text-xl font-black text-black tracking-tight">大阪大阪 <span className="text-transparent bg-clip-text bg-gradient-to-r from-[#4A70A9] to-[#6386BB]">寶寶魚板</span></h1><div className="flex items-center gap-2 text-black/50 text-[10px] mt-0.5 font-medium"><Calendar size={12} /><span>{tripDates}</span><span className="w-1 h-1 bg-[#6386BB] rounded-full mx-1"></span><span>{daysCount} Days</span></div></div>
                            <div className="hidden md:flex items-center gap-3 bg-white px-4 py-2 rounded-full shadow-sm border border-[#6386BB]/20"><div className="text-right"><div className="text-xs text-[#6386BB]">Osaka</div><div className="text-sm font-bold text-black">{currentWeather ? `${Math.round(currentWeather.temperature)}°C` : "Loading..."}</div></div><div className="w-8 h-8 bg-[#FAF9F6] rounded-full flex items-center justify-center text-[#4A70A9]">{currentWeather ? getWeatherIcon(currentWeather.weathercode) : <CloudSun size={18} />}</div></div>
                        </header>
                        <div className="px-6 pb-28 md:px-10 md:pb-10 max-w-4xl mx-auto mt-2">
                            {activeTab === 'itinerary' && <ItineraryView />}
                            {activeTab === 'flights' && <FlightsView />}
                            {activeTab === 'transport' && <TransportView />}
                            {activeTab === 'accommodation' && <AccommodationView />}
                            {activeTab === 'weather' && <WeatherView />}
                            {activeTab === 'todo' && <TodoView />}
                            {activeTab === 'expenses' && <ExpensesView />}
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<OsakaTripApp />);
    </script>
</body>
</html>
